<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="1200" height="12" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4d8dff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#4d8dff" stop-opacity=".55"/>
      <stop offset="50%"  stop-color="#7aa7ff" stop-opacity=".9"/>
      <stop offset="65%"  stop-color="#3fb950" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <style>
      .r { animation: sweep 6s ease-in-out infinite alternate }
      @keyframes sweep { from { opacity:.45; transform: translateX(-40px) } to { opacity:1; transform: translateX(40px) } }
      @media (prefers-reduced-motion: reduce) { .r { animation: none; opacity: .8 } }
    </style>
  </defs>
  <rect class="r" x="0" y="5" width="1200" height="2" fill="url(#d)"/>
</svg>

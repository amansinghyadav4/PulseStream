<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="PulseStream — real-time event processing and analytics platform">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="55%" stop-color="#0e1116"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d8dff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa7ff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7aa7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d8dff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#4d8dff" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#7aa7ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d8dff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4d8dff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4d8dff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .drift  { animation: drift 9s ease-in-out infinite alternate; }
      .drift2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
      .trace  { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: trace 4.2s ease-out forwards; }
      .spark  { animation: spark 2.4s ease-in-out infinite; }
      .rise   { opacity: 0; animation: rise .9s ease-out forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
      .flow   { stroke-dasharray: 5 9; animation: flow 1.1s linear infinite; }
      @keyframes drift { from { transform: translate(0,0) } to { transform: translate(34px,-16px) } }
      @keyframes trace { to { stroke-dashoffset: 0 } }
      @keyframes spark { 0%,100% { opacity:.35; r:3.2 } 50% { opacity:1; r:5 } }
      @keyframes rise  { to { opacity: 1; transform: translateY(0) } }
      @keyframes flow  { to { stroke-dashoffset: -28 } }
      .rise { transform: translateY(10px) }
      @media (prefers-reduced-motion: reduce) {
        .drift,.drift2,.spark,.flow { animation: none }
        .trace { stroke-dashoffset: 0; animation: none }
        .rise { opacity: 1; transform: none; animation: none }
      }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#sky)"/>
  <circle class="drift"  cx="230" cy="70"  r="300" fill="url(#glowA)"/>
  <circle class="drift2" cx="980" cy="250" r="280" fill="url(#glowB)"/>

  <!-- pulse trace -->
  <path class="trace" fill="none" stroke="url(#wave)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
        d="M0 250 H150 L176 214 L196 278 L220 206 L246 282 L268 240 H420 L450 218 L474 274 L500 212 L522 258 H700 L728 222 L750 272 L776 214 L800 254 H980 L1006 220 L1028 276 L1052 240 H1200"/>
  <circle class="spark" cx="1152" cy="240" r="4" fill="#3fb950"/>

  <!-- wordmark -->
  <g class="rise d1" transform="translate(72,96)">
    <rect x="0" y="-2" width="42" height="42" rx="12" fill="rgba(77,141,255,.14)" stroke="rgba(77,141,255,.42)"/>
    <path d="M9 19h6l4-11 6 22 4-11h6" fill="none" stroke="#7aa7ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="t rise d1" x="128" y="130" fill="#e8ecf1" font-size="52" font-weight="700" letter-spacing="-1.4">PulseStream</text>
  <text class="t rise d2" x="130" y="166" fill="#9aa5b1" font-size="17.5" letter-spacing=".2">Real-time event processing &amp; analytics — from ingest to dashboard in one pipeline.</text>

  <!-- inline topology strip -->
  <g class="t rise d3" transform="translate(130,196)" font-size="11.5" letter-spacing=".9">
    <g fill="#66707c">
      <text x="0"   y="14">API</text>
      <text x="66"  y="14">KAFKA</text>
      <text x="156" y="14">WORKERS</text>
      <text x="264" y="14">POSTGRES · REDIS</text>
      <text x="424" y="14">WEBSOCKET</text>
    </g>
    <g stroke="#4d8dff" stroke-width="1.4" opacity=".75" class="flow">
      <path d="M32 10 H58"/><path d="M112 10 H148"/><path d="M226 10 H256"/><path d="M400 10 H416"/>
    </g>
  </g>

  <rect x="0" y="297" width="1200" height="2" fill="url(#rule)"/>
</svg>

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsestream-postgres
    environment:
      POSTGRES_USER: pulsestream
      POSTGRES_PASSWORD: pulsestream
      POSTGRES_DB: pulsestream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsestream -d pulsestream"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: pulsestream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Phase 2A canonical defaults — 6 partitions for parallelism, RF 1 for single-node dev
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsestream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.13-slim
    container_name: pulsestream-api
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+asyncpg://pulsestream:pulsestream@postgres:5432/pulsestream
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      # Ingestion auth: dash-form default means an explicitly EMPTY host value
      # disables auth; unset falls back to the documented local dev key.
      PULSESTREAM_API_KEYS: ${PULSESTREAM_API_KEYS-ps_demo_key_local}
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: pulsestream-frontend
    # nginx injects this as X-API-Key on /api proxying — the browser never
    # sees even the development key.
    environment:
      DEMO_API_KEY: ${PULSESTREAM_API_KEYS-ps_demo_key_local}
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Demo Store — a simulated CUSTOMER APPLICATION (not part of PulseStream's
  # core). It talks to PulseStream exactly like any external client would:
  # HTTP POST /api/v1/events via its own nginx proxy. No DB/Redis/Kafka access.
  demo-store:
    build: ./demo-store
    container_name: pulsestream-demo-store
    environment:
      DEMO_API_KEY: ${PULSESTREAM_API_KEYS-ps_demo_key_local}
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3


  persistence-worker:
    image: python:3.13-slim
    container_name: pulsestream-persistence-worker
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python -m worker.persistence_worker"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+asyncpg://pulsestream:pulsestream@postgres:5432/pulsestream
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py", "persistence"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s

  analytics-worker:
    image: python:3.13-slim
    container_name: pulsestream-analytics-worker
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && python -m worker.analytics_worker"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+asyncpg://pulsestream:pulsestream@postgres:5432/pulsestream
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py", "analytics"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:



